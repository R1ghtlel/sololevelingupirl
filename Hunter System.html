<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunter System</title>
<style>
:root{color-scheme:dark;--bg:#06020f;--panel:rgba(18,6,38,.84);--line:#8a4dff;--glow:#b983ff;--tx:#f1e8ff;--mut:#a98fd6;--red:#ff4d6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2a0f5c 0,var(--bg) 60%) fixed;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}
.lg{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.lg button{background:none;border:1px solid #4a2a8c;color:var(--mut);padding:6px 12px;font-size:12px;letter-spacing:2px}
.lg button.on{color:#000;background:var(--glow);border-color:var(--glow)}
.win{position:relative;background:var(--panel);border:1px solid var(--line);margin-bottom:16px;padding:16px;box-shadow:0 0 18px rgba(138,77,255,.35),inset 0 0 22px rgba(138,77,255,.12)}
.win:before,.win:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow)}
.win:before{top:-4px;left:-4px;border-right:0;border-bottom:0}
.win:after{bottom:-4px;right:-4px;border-left:0;border-top:0}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--glow);text-shadow:0 0 8px var(--glow);margin:0 0 14px}
.ttl:before,.ttl:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.ttl:after{transform:scaleX(-1)}
.hero{display:flex;gap:14px;align-items:center}
.rank{width:72px;height:72px;flex:none;border:2px solid var(--glow);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px var(--glow),inset 0 0 14px rgba(185,131,255,.4);animation:p 2.5s infinite}
.rank b{transform:rotate(-45deg);font-size:30px;color:#fff;text-shadow:0 0 12px var(--glow)}
@keyframes p{50%{box-shadow:0 0 28px var(--glow),inset 0 0 20px rgba(185,131,255,.6)}}
.row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.row b{color:var(--tx)}
.bar{height:8px;background:#150a2e;border:1px solid #4a2a8c;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6a2cff,#d6a8ff);box-shadow:0 0 10px var(--glow);transition:width .5s}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st div{border:1px solid #4a2a8c;padding:8px;text-align:center;background:rgba(60,24,120,.25)}
.st b{display:block;font-size:22px;color:#fff;text-shadow:0 0 8px var(--glow)}
.st span{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:10px 2px;background:none;border:1px solid #4a2a8c;color:var(--mut);letter-spacing:1px;font-size:10px;text-transform:uppercase}
.tab.on{color:#fff;border-color:var(--glow);background:rgba(138,77,255,.2);box-shadow:0 0 12px rgba(138,77,255,.5)}
.warn{font-size:12px;color:var(--red);text-align:center;margin-bottom:12px;letter-spacing:1px}
.q{display:flex;align-items:center;gap:12px;padding:12px 8px;border:1px solid #4a2a8c;margin-bottom:8px;background:rgba(60,24,120,.2)}
.q.done{opacity:.55;border-color:#2c6a4a}
.q.done .t{text-decoration:line-through}
.ck{width:30px;height:30px;flex:none;background:none;border:2px solid var(--line);color:#000;font-size:18px}
.q.done .ck{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.t{flex:1;font-size:15px}
.t small,.c small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;margin-top:2px;text-transform:uppercase}
.x{background:none;border:0;color:var(--mut);font-size:20px}
.cat{font-size:11px;letter-spacing:3px;color:var(--glow);margin:14px 0 8px;text-transform:uppercase}
.c{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #4a2a8c;margin-bottom:8px;background:rgba(60,24,120,.2);width:100%;color:var(--tx);text-align:left;font-size:15px}
.c span.n{flex:1}
.c em{font-style:normal;font-size:11px;letter-spacing:1px;padding:4px 8px;border:1px solid var(--line);color:var(--glow)}
.c.on{border-color:var(--glow);background:rgba(138,77,255,.25);box-shadow:0 0 10px rgba(138,77,255,.4)}
.c.on em{background:var(--glow);color:#000}
.add{display:flex;gap:6px;flex-wrap:wrap}
input,select{background:#0d0520;border:1px solid var(--line);color:var(--tx);padding:10px;font-size:14px}
input{flex:1;min-width:130px}
.go{background:var(--glow);color:#000;border:0;font-weight:700;padding:10px 16px}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:14px}
.off{opacity:.45}.sk{width:100%;padding:11px;margin-bottom:12px;background:none;border:1px solid var(--red);color:var(--red);letter-spacing:2px;font-size:12px;text-transform:uppercase}.sk:disabled{border-color:#4a2a8c;color:var(--mut)}.sk.on{background:rgba(255,77,106,.15)}
.dp{display:flex;gap:4px;margin:-4px 0 8px}.dp button{flex:1;padding:8px 0;font-size:11px;background:none;border:1px solid #4a2a8c;color:var(--mut)}.dp button.on{background:var(--glow);color:#000;border-color:var(--glow)}
.gl,.lf{border:1px solid #4a2a8c;padding:10px;margin-bottom:8px;background:rgba(60,24,120,.2)}.gl.ok{border-color:#2c6a4a;opacity:.6}.gl small,.lf small{display:block;color:var(--mut);font-size:11px;margin-top:3px;letter-spacing:1px}.lf .rk{float:right;font-size:24px;color:#fff;text-shadow:0 0 8px var(--glow)}.ai{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(6,0,14,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov.on{display:flex}
.ov .win{text-align:center;max-width:340px;width:100%;margin:0}
.ov h2{margin:6px 0;letter-spacing:4px;color:#fff;text-shadow:0 0 14px var(--glow)}
.rs{width:100%;background:none;border:1px solid #4a2a8c;color:var(--mut);padding:10px;font-size:11px;letter-spacing:2px;text-transform:uppercase}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.w{position:relative;z-index:1}
.brand{text-align:center;margin:2px 0 14px}
.brand h1{margin:0;font-size:24px;letter-spacing:10px;font-weight:700;color:#fff;text-shadow:0 0 12px var(--glow),0 0 34px var(--line);animation:fl 4s infinite}
.brand small{display:block;letter-spacing:6px;font-size:10px;color:var(--glow);margin-top:6px;text-transform:uppercase}
@keyframes fl{50%{text-shadow:0 0 6px var(--glow),0 0 16px var(--line)}}
.win{animation:in .5s both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bar i{background-size:200% 100%;animation:sh 2.5s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.rank{position:relative}
.rank:before{content:"";position:absolute;inset:-11px;border:1px dashed var(--glow);opacity:.6;animation:sp 14s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.q,.c,.gl,.lf{transition:box-shadow .2s,border-color .2s}
.q:hover,.c:hover,.gl:hover,.lf:hover{box-shadow:0 0 14px rgba(138,77,255,.55);border-color:var(--glow)}
.ov.on .win{animation:bu .45s}@keyframes bu{from{transform:scale(.7);opacity:0;filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<canvas id="fx"></canvas>
<div class="w">
<div class="brand"><h1>SYSTEM</h1><small data-i="brand"></small></div>

  <div id="list"></div>
</div>

<div id="p2" style="display:none">

      <select id="stat"><option value="str" data-i="str_o"></option><option value="int" data-i="int_o"></option><option value="end" data-i="end_o"></option></select>
      <input id="xp" type="number" value="30" min="5" max="200" style="max-width:76px;flex:none">
      <button class="go" id="addb">+</button>
    </div>
  </div>
  <button class="rs" id="reset" data-i="reset"></button>
</div>
<div id="p3" style="display:none">
 <div class="win"><p class="ttl" data-i="goals_t"></p><div id="glist"></div></div>
 <div class="win"><p class="ttl" data-i="goal_new"></p>
  <div class="add">
   <input id="gname" data-ip="g_name">
   <select id="gex"><option value="bench" data-i="ex_bench"></option><option value="squat" data-i="ex_squat"></option><option value="dead" data-i="ex_dead"></option><option value="ohp" data-i="ex_ohp"></option><option value="" data-i="ex_other"></option></select>
   <input id="gw" type="number" min="1" data-ip="lw" style="max-width:96px;flex:none">
   <input id="gr" type="number" min="1" value="1" data-ip="lr" style="max-width:80px;flex:none">
   <input id="gby" type="date" style="max-width:150px;flex:none">
   <input id="gxp" type="number" value="100" min="10" max="500" style="max-width:76px;flex:none">
   <button class="go" id="gadd">+</button>
  </div></div>
</div>
<div id="p4" style="display:none">
 <div class="win"><p class="ttl" data-i="sec_body"></p>
  <div class="add"><input id="bw" type="number" min="30" max="300" data-ip="bw"><input id="ht" type="number" min="100" max="250" data-ip="ht"><select id="sex"><option value="m" data-i="sex_m"></option><option value="f" data-i="sex_f"></option></select></div></div>
 <div class="win"><p class="ttl" data-i="str_t"></p><div id="lifts"></div><div style="font-size:11px;color:var(--mut)" data-i="note"></div></div>
 <div class="win"><p class="ttl" data-i="lift_log"></p>
  <div class="add"><select id="lex"><option value="bench" data-i="ex_bench"></option><option value="squat" data-i="ex_squat"></option><option value="dead" data-i="ex_dead"></option><option value="ohp" data-i="ex_ohp"></option></select><input id="lw2" type="number" min="1" data-ip="lw" style="max-width:100px;flex:none"><input id="lr2" type="number" min="1" value="5" data-ip="lr" style="max-width:80px;flex:none"><button class="go" id="ladd">+</button></div></div>
 <div class="win"><p class="ttl" data-i="ai_t"></p>
  <input id="aiq" data-ip="ai_q" style="width:100%;margin-bottom:8px">
  <div class="add"><button class="go" id="ai1" data-i="ai_train" style="flex:1"></button><button class="go" id="ai2" data-i="ai_study" style="flex:1"></button></div>
  <div class="ai" id="aiout"></div><div style="font-size:11px;color:var(--mut);margin-top:8px" data-i="ai_disc"></div></div>
</div>
</div>

<div class="ov" id="ov"><div class="win">
  <p class="ttl" data-i="system"></p>
  <h2 id="ovt"></h2>
  <div id="ovs" style="color:var(--glow);margin:8px 0 16px"></div>
  <button class="go" id="ovb" style="width:100%" data-i="accept"></button>
</div></div>

function load(){
LANG=(navigator.language||"").toLowerCase().indexOf("ru")===0?"ru":"en";
try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}
if(!S.sk)S.sk=[];
if(!S.lang)S.lang=LANG;if(!S.lifts)S.lifts=[];if(!S.goals)S.goals=[];
LANG=S.lang;
if(S.day!==today()){var gap=Math.max(1,Math.round((new Date(today())-new Date(S.day))/86400000)),miss=0,d0=new Date(S.day).getTime();
for(var i=0;i<gap;i++){var dt=new Date(d0+i*86400000),w=dt.getUTCDay();if(S.sk.indexOf(dt.toISOString().slice(0,10))>-1)continue;S.quests.forEach(function(q){if(on(q,w)&&(i>0||!q.d))miss+=q.x})}
var pen=Math.min(S.xp,Math.round(miss*0.5));
if(pen>0&&S.quests.length){S.xp-=pen;PEN={p:pen,g:gap}}
S.quests.forEach(function(q){q.d=false});S.day=today();save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function lvl(){return Math.floor(S.xp/100)+1}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function has(id){return S.quests.some(function(q){return q.id===id})}
function applyLang(){
document.documentElement.lang=LANG;
Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(el){el.textContent=t(el.getAttribute("data-i"))});
Array.prototype.forEach.call(document.querySelectorAll("[data-ip]"),function(el){el.placeholder=t(el.getAttribute("data-ip"))});
document.getElementById("l_ru").className=LANG==="ru"?"on":"";
document.getElementById("l_en").className=LANG==="en"?"on":""}
function render(){
var l=lvl(),p=S.xp%100;
document.getElementById("lvl").textContent=l;
var ri=Math.min(Math.floor((l-1)/5),5);document.getElementById("rank").textContent=RANKS[ri];document.getElementById("hn").textContent=t("rt")[ri];
document.getElementById("bar").style.width=p+"%";
document.getElementById("xpt").textContent=p+"/100 XP";
["str","int","end"].forEach(function(k){document.getElementById("s_"+k).textContent=S.stats[k]});
var td=today(),sick=S.sk.indexOf(td)>-1,skb=document.getElementById("sick"),last=S.sk.slice().sort().pop(),left=last?14-Math.round((new Date(td)-new Date(last))/86400000):0;
if(sick)skb.innerHTML='<button class="sk on" data-sk="off">'+t("sickOn")+'</button>';
else if(left>0)skb.innerHTML='<button class="sk" disabled>'+t("sickCool")(left)+'</button>';
else skb.innerHTML='<button class="sk" data-sk="on">'+t("sickBtn")+'</button>';
var AQ=act(),dn=AQ.filter(function(q){return q.d}).length;
document.getElementById("today").textContent=dn+"/"+AQ.length;
var h="",rest="";S.quests.forEach(function(q){var ac=on(q,wd()),id=esc(q.id);
var row='<div class="q'+(q.d?' done':'')+(ac?'':' off')+'">'+(ac?'<button class="ck" data-c="'+id+'">'+(q.d?'✓':'')+'</button>':'<div class="ck" style="border-color:#4a2a8c"></div>')+'<div class="t">'+esc(qn(q))+'<small>+'+q.x+' XP · '+t(q.s)+' · '+dl(q)+'</small></div><button class="x" data-w="'+id+'">📅</button><button class="x" data-r="'+id+'">×</button></div>';
if(OPEN===q.id){row+='<div class="dp">';[1,2,3,4,5,6,0].forEach(function(n){row+='<button data-d="'+n+'" data-q="'+id+'" class="'+((!q.w||q.w.indexOf(n)>-1)?'on':'')+'">'+t("days")[n]+'</button>'});row+='</div>'}
if(ac)h+=row;else rest+=row});
document.getElementById("list").innerHTML=h+(rest?'<div class="cat">'+t("notToday")+'</div>'+rest:'')||'<div class="empty">'+t("none")+'</div>';
var c="";CAT.forEach(function(g){c+='<div class="cat">'+g.g[li()]+'</div>';
g.i.forEach(function(it){var id="c_"+it[0],o=has(id);
c+='<button class="c'+(o?' on':'')+'" data-a="'+esc(id)+'" data-n="'+esc(it[0])+'" data-s="'+it[2]+'" data-x="'+it[3]+'"><span class="n">'+esc(it[li()])+'<small>+'+it[3]+' XP · '+t(it[2])+'</small></span><em>'+(o?t("taken"):t("take"))+'</em></button>'})});
document.getElementById("cat").innerHTML=c;renderX()}
function pop(a,b){document.getElementById("ovt").textContent=a;document.getElementById("ovs").textContent=b;document.getElementById("ov").className="ov on"}
document.getElementById("ovb").onclick=function(){document.getElementById("ov").className="ov"};
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.getAttribute("data-l");if(!l)return;LANG=l;S.lang=l;save();applyLang();render()});
document.getElementById("list").addEventListener("click",function(e){
var tg=e.target,w=tg.getAttribute("data-w"),dd=tg.getAttribute("data-d");
if(w){OPEN=OPEN===w?null:w;render();return}
if(dd!==null){var qq=S.quests.filter(function(z){return z.id===tg.getAttribute("data-q")})[0],n=parseInt(dd),arr=qq.w?qq.w.slice():[0,1,2,3,4,5,6],k=arr.indexOf(n);if(k>-1){if(arr.length>1)arr.splice(k,1)}else arr.push(n);qq.w=arr.length===7?null:arr;save();render();return}
var c=tg.getAttribute("data-c"),r=tg.getAttribute("data-r"),up=false;
if(c){var q=S.quests.filter(function(z){return z.id===c})[0],b=lvl();
 if(!q.d){q.d=true;S.xp+=q.x;S.stats[q.s]+=q.x;if(lvl()>b)up=true}
 else{q.d=false;S.xp=Math.max(0,S.xp-q.x);S.stats[q.s]=Math.max(0,S.stats[q.s]-q.x)}}
if(r){S.quests=S.quests.filter(function(z){return z.id!==r})}
save();render();
if(up)pop(t("lvlUp"),t("lvlNew")(lvl()));
else if(c&&act().length&&act().every(function(z){return z.d}))pop(t("allDone"),t("allDoneS"))});
document.getElementById("sick").addEventListener("click",function(e){var a=e.target.getAttribute("data-sk"),td=today();
if(a==="on"&&confirm(t("sickConf"))){S.sk.push(td);save();render();pop(t("sickT"),t("sickS"))}
else if(a==="off"){S.sk=S.sk.filter(function(x){return x!==td});save();render()}});
document.getElementById("cat").addEventListener("click",function(e){
var b=e.target.closest(".c");if(!b)return;var id=b.getAttribute("data-a");
if(has(id))S.quests=S.quests.filter(function(z){return z.id!==id});
else S.quests.push({id:id,n:b.getAttribute("data-n"),s:b.getAttribute("data-s"),x:parseInt(b.getAttribute("data-x")),d:false});
save();render()});
document.getElementById("addb").onclick=function(){
var n=document.getElementById("name").value.trim();if(!n)return;
S.quests.push({id:"u_"+Date.now(),n:n,s:document.getElementById("stat").value,x:parseInt(document.getElementById("xp").value)||30,d:false});
document.getElementById("name").value="";save();render()};
document.getElementById("reset").onclick=function(){if(confirm(t("resetConf"))){S=fresh();save();render()}};
function tab(n){[1,2,3,4].forEach(function(i){document.getElementById("p"+i).style.display=i==n?"block":"none";document.getElementById("t"+i).className="tab"+(i==n?" on":"")})}
[1,2,3,4].forEach(function(i){document.getElementById("t"+i).onclick=function(){tab(i)}});
var EX={bench:[.5,.75,1.25,1.75,2],squat:[.75,1.25,1.75,2.25,2.75],dead:[1,1.5,2,2.5,3],ohp:[.35,.55,.8,1.05,1.3]},EL=['bench','squat','dead','ohp'];
function $(i){return document.getElementById(i)}
function e1(w,r){return r<=1?w:w*(1+r/30)}
function best(k){var b=0;S.lifts.forEach(function(l){if(l.e===k)b=Math.max(b,e1(l.w,l.r))});return b}
function thr(k){var f=S.sex==='f'?.65:1;return EX[k].map(function(x){return x*f*(S.bw||0)})}
function rk(k){var b=best(k),tt=thr(k),i=0;while(i<5&&b>=tt[i])i++;return i}
function gain(x,s){S.xp+=x;if(s)S.stats[s]+=x}
function checkGoals(){var td=today(),msg=null;S.goals.forEach(function(o){if(o.d||!o.e)return;if(o.by&&td>o.by)return;if(S.lifts.some(function(l){return l.e===o.e&&l.d>=o.c&&l.w>=o.w&&l.r>=o.r})){o.d=true;gain(o.x,'str');msg=(msg?msg+' · ':'')+o.n+' +'+o.x+' XP'}});return msg}
function renderX(){
var td=today(),g='';
S.goals.forEach(function(o){var left=o.by?Math.ceil((new Date(o.by)-new Date(td))/86400000):0,pc=o.e?Math.min(100,Math.round(best(o.e)/e1(o.w,o.r)*100)):0,st=o.by?' · '+(o.d?'✓':left>=0?t('g_left')+left:t('g_over')):'';
g+='<div class="gl'+(o.d?' ok':'')+'"><div style="display:flex;gap:8px;align-items:center"><div style="flex:1">'+esc(o.n)+'<small>'+(o.e?t('ex_'+o.e)+' '+o.w+' '+t('kg')+' × '+o.r+' · ':'')+'+'+o.x+' XP'+st+'</small></div>'+(!o.d&&!o.e?'<button class="go" data-gf="'+o.id+'">'+t('g_finish')+'</button>':'')+'<button class="x" data-gx="'+o.id+'">×</button></div>'+(o.e&&!o.d?'<div class="bar"><i style="width:'+pc+'%"></i></div>':'')+'</div>'});
$('glist').innerHTML=g||'<div class="empty">'+t('g_none')+'</div>';
var h='';EL.forEach(function(k){var b=best(k);if(!b)return;var i=S.bw?rk(k):0,nx=i<5?Math.ceil(thr(k)[i]-b):0;
h+='<div class="lf"><span class="rk">'+(S.bw?RANKS[i]:'–')+'</span><b>'+t('ex_'+k)+'</b><small>'+t('e1rm')+': '+Math.round(b)+' '+t('kg')+(S.bw&&i<5?' · '+t('next')(RANKS[i+1],nx):'')+'</small></div>'});
$('lifts').innerHTML=(h&&!S.bw?'<div class="empty">'+t('need_bw')+'</div>':'')+(h||'<div class="empty">'+t('nolift')+'</div>')}
$('bw').onchange=function(){S.bw=parseFloat(this.value)||0;save();renderX()};
$('sex').onchange=function(){S.sex=this.value;save();renderX()};
$('ht').onchange=function(){S.h=parseFloat(this.value)||0;save()};
$('ladd').onclick=function(){var w=parseFloat($('lw2').value),r=parseInt($('lr2').value);if(!(w>0)||!(r>0))return;var k=$('lex').value,pb=best(k)>0&&e1(w,r)>best(k);
S.lifts.push({e:k,w:w,r:r,d:today()});if(pb)gain(20,'str');var gd=checkGoals();save();render();
if(gd)pop(t('g_done'),gd);else if(pb)pop(t('pb'),t('pbs')(t('ex_'+k),20));$('lw2').value=''};
$('gadd').onclick=function(){var e=$('gex').value,n=$('gname').value.trim(),w=parseFloat($('gw').value),r=parseInt($('gr').value)||1;
if(e&&!(w>0))return;if(!n&&e)n=t('ex_'+e)+' '+w+' '+t('kg')+' × '+r;if(!n)return;
S.goals.push({id:'g'+Date.now(),n:n,e:e,w:w||0,r:r,by:$('gby').value||'',x:parseInt($('gxp').value)||100,d:false,c:today()});$('gname').value='';save();render()};
$('glist').addEventListener('click',function(ev){var f=ev.target.getAttribute('data-gf'),x=ev.target.getAttribute('data-gx');
if(f){var o=S.goals.filter(function(z){return z.id===f})[0];o.d=true;gain(o.x,null);save();render();pop(t('g_done'),o.n+' +'+o.x+' XP');return}
if(x){S.goals=S.goals.filter(function(z){return z.id!==x});save();render()}});
function ask(kind){var out=$('aiout');out.textContent=t('ai_wait');
if(!window.claude){out.textContent=t('ai_na');return}
claude.use('sample').then(function(sm){if(!sm){out.textContent=t('ai_na');return}
var lf=EL.filter(best).map(function(k){return t('ex_'+k)+': '+Math.round(best(k))+' kg (rank '+(S.bw?RANKS[rk(k)]:'?')+')'}).join('; ');
var gs=S.goals.filter(function(o){return !o.d}).map(function(o){return o.n+(o.by?' by '+o.by:'')}).join('; ');
var qs=S.quests.map(function(q){return qn(q)+' ['+dl(q)+']'}).join('; ');
var p='You are a concise, practical '+(kind==='train'?'strength training coach':'study coach')+' inside a gamified habit tracker. Reply in '+(LANG==='ru'?'Russian':'English')+', plain text, no markdown, max 180 words, with 4-5 specific actionable tips. This is general guidance, not medical advice; mention safety where relevant.\nUser data: body weight '+(S.bw||'unknown')+' kg, height '+(S.h||'unknown')+' cm, sex '+(S.sex==='f'?'female':'male')+'; best estimated 1RM: '+(lf||'none logged')+'; open goals: '+(gs||'none')+'; daily quests: '+(qs||'none')+'.\nUser question: '+($('aiq').value.trim()||'(none, give general advice for my situation)');
return sm(p,{cache:false,onText:function(r){out.textContent=r.text}})}).catch(function(){out.textContent=t('ai_err')})}
$('ai1').onclick=function(){ask('train')};
$('ai2').onclick=function(){ask('study')};
load();applyLang();$('bw').value=S.bw||'';$('ht').value=S.h||'';$('sex').value=S.sex||'m';render();
if(PEN)pop(t("penT"),t("pen")(PEN.p,PEN.g));
try{if(!matchMedia('(prefers-reduced-motion:reduce)').matches){(function(){var c=$('fx'),x=c.getContext('2d'),P=[],W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
for(var i=0;i<45;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.5+.15,a:Math.random()*.6+.2});
function f(){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;p.x+=Math.sin(p.y/40)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.fillStyle='rgba(185,131,255,'+p.a+')';x.shadowColor='#b983ff';x.shadowBlur=8;x.arc(p.x,p.y,p.r,0,6.283);x.fill()});requestAnimationFrame(f)}f()})()}}catch(e){}
</script>
</body>
</html>
